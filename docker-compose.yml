services:
  mysql:
    image: mysql:8.0
    container_name: koperasi_mysql
    restart: unless-stopped
    ports:
      - "33060:3306"
    environment:
      MYSQL_DATABASE: koperasi
      MYSQL_USER: koperasi_user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - koperasi_mysql_data:/var/lib/mysql
    networks:
      - koperasi_network

  adminer:
    image: adminer
    container_name: koperasi_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
    networks:
      - koperasi_network

volumes:
  koperasi_mysql_data:

networks:
  koperasi_network:
    driver: bridge
